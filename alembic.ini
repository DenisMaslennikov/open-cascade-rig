# The wrapper's Alembic configuration. The database path is never set here: it arrives as the
# ``db_path`` -x option or the ``WRAPPER_DB_PATH`` variable, and ``alembic/env.py`` stops with an
# instruction when neither is given. ``sqlalchemy.url`` below is unused by ``env.py`` and exists
# only so Alembic accepts the file.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
