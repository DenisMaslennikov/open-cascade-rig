# mutmut 3.x reads this from the directory it runs in; a mutant key is the path relative to it,
# so from `bin` the key is `rig.schema_design.x_main` — the name the tests import.
# Run:  cd bin && ../.venv/bin/python -m mutmut run
[mutmut]
source_paths = rig
pytest_add_cli_args_test_selection =
    tests
