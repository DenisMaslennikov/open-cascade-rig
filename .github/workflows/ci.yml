name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scripts:
    name: Scripts — lint, format, tests, property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # The suite lives under bin/ with the modules (card #191): `bin/tests`, run from `bin`, so the
      # `rig` package resolves without a `pythonpath` setting.
      - name: Tests
        run: |
          if [ -n "$(find bin/tests -name 'test_*.py' 2>/dev/null)" ]; then
            cd bin && python -m pytest
          else
            echo "no tests yet — the coverage card is still open"
          fi
      - name: Property tests
        run: |
          if [ -n "$(find bin/tests -name 'test_*.py' 2>/dev/null)" ]; then
            cd bin && python -m pytest -m property || echo "no property tests marked yet"
          fi

  security:
    name: Security — semgrep and gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q semgrep
      # Only ERROR findings fail the build; WARNING findings are the recorded debt in .semgrep.yml.
      - run: semgrep --config .semgrep.yml --severity ERROR --error --quiet
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  decisions:
    name: Decisions — decision log lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Directly, not through `make`: a developer machine may not have make, and a gate that only
      # runs in CI teaches nothing locally.
      - run: |
          grep -qE '^### D[0-9]+\.' DECISIONS.md || { echo "DECISIONS.md: no D-numbered entries"; exit 1; }
          echo "DECISIONS.md: ok"
